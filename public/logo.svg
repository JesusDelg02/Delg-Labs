<svg width="400" height="90" viewBox="0 0 400 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="labsGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="logoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="skewX(-8)" font-family="Arial, Helvetica, sans-serif" font-weight="900">
    <text x="0" y="65" font-size="70" fill="#FAFAFA" letter-spacing="-2">DELG</text>
    <text x="205" y="65" font-size="70" fill="url(#labsGrad)" letter-spacing="-2" filter="url(#logoGlow)">LABS</text>
  </g>
</svg>
